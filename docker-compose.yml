# Full stack on one command:  docker compose up --build
#   React client  -> http://localhost:5173
#   Laravel API   -> http://localhost:8800/api
#   Reverb (ws)   -> ws://localhost:8080
#   PostgreSQL    -> localhost:5432  (user/password: boardingfinder)
# Demo logins use the password `password123` (see backend/README.md).

x-backend-env: &backend-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: ${APP_KEY:-}
  APP_URL: http://localhost:8800
  CLIENT_URL: http://localhost:5173
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: boardingfinder
  DB_USERNAME: boardingfinder
  DB_PASSWORD: boardingfinder
  SESSION_DRIVER: array
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: boardingfinder
  REVERB_APP_KEY: boardingfinder-local-key
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-boardingfinder-local-secret}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boardingfinder
      POSTGRES_USER: boardingfinder
      POSTGRES_PASSWORD: boardingfinder
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardingfinder -d boardingfinder"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      SEED_DEMO: "true"
    ports: ["8800:8800"]
    volumes: [api-storage:/var/www/storage]
    depends_on:
      db: { condition: service_healthy }

  reverb:
    build: ./backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *backend-env
    ports: ["8080:8080"]
    depends_on: [api]

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:8800/api
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: 8080
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  db-data:
  api-storage:
